# nginx in front of Spindle on the same host. Put this in a server context
# that already has your certificate (certbot or similar). Spindle listens
# on 127.0.0.1:8008.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matrix.example.org;

    ssl_certificate     /etc/letsencrypt/live/matrix.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.org/privkey.pem;

    # Keep this at or above [media] max_upload_bytes.
    client_max_body_size 100M;

    # Federation peers read this to find the port.
    location = /.well-known/matrix/server {
        default_type application/json;
        return 200 '{"m.server": "matrix.example.org:443"}';
    }

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /sync is a long poll: the server holds the request open. The
        # nginx default of 60 seconds is enough; do not lower it. Raise it
        # if you set a long sync timeout.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Send events to the client at once, and do not spool uploads.
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
