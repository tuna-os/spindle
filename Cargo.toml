[workspace]
members = ["crates/spindle-core", "crates/spindle-server", "crates/spindle-store"]
resolver = "2"

[workspace.package]
edition = "2024"
# Dual, the Rust ecosystem's convention: Apache-2.0 carries an explicit patent
# grant, MIT is the simplest thing a downstream can comply with, and taking
# either is the licensee's choice. See LICENSING.md for why not AGPL (#233).
license = "MIT OR Apache-2.0"
rust-version = "1.89"
repository = "https://github.com/tuna-os/spindle"

[workspace.dependencies]
argon2 = "0.5"
axum = "0.8"
form_urlencoded = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "gzip", "stream"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
sha2 = "0.10"
hmac = "0.12"
blake3 = "1.8"
# Thumbnails only. Default features off and codecs named, because the default
# set drags in every format the crate knows -- each decoder is attack surface
# fed with attacker-controlled bytes, so the list is the formats we thumbnail
# and nothing else.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fjall = "2.11.2"
proptest = "1.7"
rand = "0.10"
# The Synapse importer's SQLite reader only, behind the non-default
# `synapse-import` feature. `bundled` compiles SQLite itself: a one-shot
# migration tool is not a reason to make every operator install a system
# library, nor to make the default build pay for one.
rusqlite = { version = "0.37", features = ["bundled"] }
im = "15"
# `state-res` is a runtime dependency, not just an oracle: SPEC 9.3 and
# docs/divergence.md both require the local send path to use the same auth
# predicate the siblings use. ADR 0002 permits this above the core.
ruma = { version = "0.16", features = ["signatures", "state-res", "events"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Appservice registration files are YAML by spec, and their namespaces are
# anchored regular expressions — both formats arrive from the operator, not
# the network.
serde_yaml = "0.9"
regex = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
# Not in `all` or `pedantic`, and both are about cost rather than style: a
# large stack frame is a crash on a deep call, and a large future is a
# per-request allocation. See clippy.toml for the thresholds.
large_stack_frames = "deny"
