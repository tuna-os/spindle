[workspace]
members = ["crates/spindle-core", "crates/spindle-server", "crates/spindle-store"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/tuna-os/spindle"

[workspace.dependencies]
argon2 = "0.5"
axum = "0.8"
blake3 = "1.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fjall = "2.11.2"
proptest = "1.7"
rand = "0.8"
im = "15"
ruma = { version = "0.16", features = ["signatures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
toml = "0.8"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
