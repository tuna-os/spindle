[workspace]
members = ["crates/spindle-core", "crates/spindle-store"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/hanthor/spindle"

[workspace.dependencies]
blake3 = "1.8"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
fjall = "2.11.2"
proptest = "1.7"
ruma = { version = "0.16", features = ["signatures"] }
serde_json = "1.0"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
