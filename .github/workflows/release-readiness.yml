name: Release readiness

# Runs on a pull request only when something the lifecycle rehearsal builds
# or runs changed (Rust sources, the vendored crate, the manifests, the
# toolchain pin, the rehearsal script, this file). Prose and unrelated
# scripts cannot move it, and no job here is a required check, so a run that
# never starts blocks nothing. It no longer runs on every push to main: each
# merge was a PR whose head already ran it; the nightly run below covers
# main every day, including an interaction between two PRs.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - scripts/release-lifecycle.py
      - .github/workflows/release-readiness.yml
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: Real version-boundary lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - name: Prepare the last schema-2 checkout
        run: git worktree add --detach old-version 496a77a029026a3acd087b4851c42e746bd9b9db
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            . -> target
            old-version -> target
      - name: Build candidate and exercise the state-resolution oracle
        run: |
          cargo build --locked -p spindle-server
          cargo test --locked -p spindle-core --test state_res_equivalence --test fork_window_equivalence
          cargo test --locked -p spindle-server --test side_stream_delivery
          cargo test --locked -p spindle-server --test sync acknowledged_to_device_positions_survive_restart_without_push
      - name: Build the last schema-2 version
        run: |
          cargo build --locked --manifest-path old-version/Cargo.toml -p spindle-server
      - name: Rehearse upgrade and rollback
        run: >-
          python3 scripts/release-lifecycle.py
          --old old-version/target/debug/spindle
          --candidate target/debug/spindle
          --commit "${GITHUB_SHA}"
          --report evidence/lifecycle.json
      - name: Smoke-test delayed-event benchmark fixtures
        run: |
          cargo bench --profile dev -p spindle-server --bench delayed_events -- --test
          cargo bench --profile dev -p spindle-server --bench call_churn
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-readiness
          path: evidence/lifecycle.json
