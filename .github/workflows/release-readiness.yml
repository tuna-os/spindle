name: Release readiness

# Prose-only changes cannot move the lifecycle, so they do not start this
# (no job here is a required check, so a run that never starts blocks
# nothing); the nightly run covers every day regardless.
on:
  pull_request:
    paths-ignore: ['**.md', '**.mdx', 'docs/**', .ste-budget]
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.mdx', 'docs/**', .ste-budget]
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle:
    name: Real version-boundary lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.90.0
      - name: Prepare the last schema-2 checkout
        run: git worktree add --detach old-version 496a77a029026a3acd087b4851c42e746bd9b9db
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            old-version -> target
      - name: Build candidate and exercise the state-resolution oracle
        run: |
          cargo build --locked -p spindle-server
          cargo test --locked -p spindle-core --test state_res_equivalence --test fork_window_equivalence
          cargo test --locked -p spindle-server --test side_stream_delivery
          cargo test --locked -p spindle-server --test sync acknowledged_to_device_positions_survive_restart_without_push
      - name: Build the last schema-2 version
        run: |
          cargo build --locked --manifest-path old-version/Cargo.toml -p spindle-server
      - name: Rehearse upgrade and rollback
        run: >-
          python3 scripts/release-lifecycle.py
          --old old-version/target/debug/spindle
          --candidate target/debug/spindle
          --commit "${GITHUB_SHA}"
          --report evidence/lifecycle.json
      - name: Smoke-test delayed-event benchmark fixtures
        run: |
          cargo bench --profile dev -p spindle-server --bench delayed_events -- --test
          cargo bench --profile dev -p spindle-server --bench call_churn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-readiness
          path: evidence/lifecycle.json
