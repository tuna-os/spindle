name: Upkeep

# What moved upstream this week, in one issue a person reads on Monday.
#
# Dependabot moves the Cargo crates, the actions, the Docker bases and the
# Go module. Everything else this repository is held against -- the Matrix
# spec, the proposals it serves under unstable names, the client and
# conformance suites it runs, the servers it benchmarks against -- is
# pinned by hand, and a pin nobody looks at is a pin that quietly ages.
# This job looks. It does not bump anything: what a newer suite asks of
# the server is exactly what a person should read before CI asks it.
#
# The three reports, each from a script that runs the same way locally
# (`just upkeep`):
#   * scripts/upstream-pins.py --upstream   which pins are behind
#   * scripts/msc-ledger.py --upstream      which served MSCs landed or died
#   * scripts/spec-drift.py against spec main   what a pin bump would bring
# They land in one issue labelled `upkeep`, edited in place each week so
# there is one thread, not fifty-two.
on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays, 04:23 UTC, after the benchmark sitting
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upkeep
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python dependencies
        run: pip install --quiet pyyaml==6.0.3 jsonschema==4.26.0
      - name: The pins, against upstream
        run: |
          mkdir -p tmp/upkeep
          python3 scripts/upstream-pins.py --upstream > tmp/upkeep/pins.md
      - name: The MSC ledger, against the proposals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/msc-ledger.py --upstream > tmp/upkeep/mscs.md
      - name: The spec at its pin, and at main
        run: |
          python3 scripts/spec-drift.py --preview > tmp/upkeep/spec-pinned.md
          git clone -q --depth 1 https://github.com/matrix-org/matrix-spec tmp/matrix-spec-main
          python3 scripts/spec-drift.py --spec tmp/matrix-spec-main --preview > tmp/upkeep/spec-main.md
          # Only the operations: the headers and counts differ by design.
          diff <(grep '^- ' tmp/upkeep/spec-pinned.md) <(grep '^- ' tmp/upkeep/spec-main.md) \
            > tmp/upkeep/spec-diff.txt || true
      - name: Assemble the report
        run: |
          {
            echo "_Written by the upkeep workflow on $(date -u +%Y-%m-%d) from run ${{ github.run_id }}. Edited in place each week; the history is in the run logs. The same report locally: \`just upkeep\`. How to act on it: [docs/maintenance.md](docs/maintenance.md)._"
            echo
            echo "## Pins"
            echo
            cat tmp/upkeep/pins.md
            echo
            echo "## MSCs"
            echo
            cat tmp/upkeep/mscs.md
            echo
            echo "## What a spec pin bump would bring"
            echo
            if [ -s tmp/upkeep/spec-diff.txt ]; then
              echo "Operations that differ between the pinned spec and matrix-spec main (\`<\` pinned only, \`>\` main only):"
              echo
              echo '```diff'
              cat tmp/upkeep/spec-diff.txt
              echo '```'
            else
              echo "None: the pinned spec and matrix-spec main define the same operations."
            fi
            echo
            echo "---"
            echo "_Generated by the upkeep workflow._"
          } > tmp/upkeep/report.md
          cat tmp/upkeep/report.md
      - name: File it, in the one upkeep issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create upkeep --description "The weekly report of what moved upstream" --color 0E8A16 --force >/dev/null 2>&1 || true
          number=$(gh issue list --label upkeep --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file tmp/upkeep/report.md
            gh issue comment "$number" --body "Refreshed on $(date -u +%Y-%m-%d) by run ${{ github.run_id }}; the body above is the current report."
            echo "updated #$number"
          else
            gh issue create --title "Upkeep: what moved upstream" --label upkeep --body-file tmp/upkeep/report.md
          fi
