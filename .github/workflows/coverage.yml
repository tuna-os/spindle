name: Coverage

# What the test suite reaches, measured rather than assumed. Not a gate
# yet: the first runs establish the number, and a floor belongs in this
# file once there is one to hold (ROADMAP.md, the v0.1.0 table, says
# evidence before promises). Weekly, because instrumented builds cost a full
# rebuild and a pull request already runs the suite.

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  measure:
    name: Line and function coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: coverage
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - name: Run the suite instrumented
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only | tee coverage-summary.txt
      - name: Put the summary where the run shows it
        run: |
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: |
            lcov.info
            coverage-summary.txt
