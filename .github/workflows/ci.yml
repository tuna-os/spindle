name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `rust-toolchain.toml` pins the version and rustup honours it over
      # whatever this step installs, so naming a different one here does
      # nothing -- this job read `toolchain: 1.85.0` for months while
      # building on 1.89. It could not have built on 1.85: `rust-version`
      # in Cargo.toml is 1.89, and cargo refuses outright below it. Left
      # unset so there is one place the version is declared.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check code
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

      # Every response the scripted client gets back from a live server,
      # validated against the matrix-spec OpenAPI at a pinned revision (#25).
      # The test step above has already built the binary it runs. The spec
      # is a shallow fetch of one commit, so it costs seconds, and pinning it
      # means a spec change cannot fail this job on its own.
      - name: Check responses against the matrix-spec OpenAPI
        run: |
          pip install --quiet jsonschema==4.26.0 pyyaml==6.0.3
          python3 scripts/openapi-check.py --binary target/debug/spindle --spec tmp/matrix-spec

      # The benchmark publishing scripts run on push to main, which is the
      # worst place to find out they are broken: the failure lands after the
      # change is in, and the site keeps serving whatever it served last.
      - name: Check the benchmark publishing tooling
        run: scripts/check-benchmark-tooling.sh

      # Same reasoning for the dashboard: it claims to describe the router,
      # and the claim is only worth reading if a stale copy cannot merge. The
      # generator also fails outright when its curated planned-list names an
      # endpoint the router now serves.
      - name: Check the dashboard matches the router
        run: python3 scripts/coverage-dashboard.py --check

      # The Complement ratchet decides whether a conformance regression can
      # merge, and its output is what somebody reads when one does. Both are
      # worth a test: #228 is a case where the gate was right, and #231 one
      # where what it printed was not enough to act on.
      - name: Check for dependencies nothing uses
        # A crate nothing imports is still a licence obligation, an audit
        # surface and a thing `cargo deny` has to reason about. Cheap to
        # carry, so it accumulates unless something says no.
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          cargo machete
      - name: Check every room read asks who is asking
        # semgrep rather than an action, for the reason the cargo-deny step
        # gives: one fewer third party running before our code in a job
        # holding a token. Pinned, because a rule engine that changes how it
        # parses Rust changes what this gate catches.
        run: |
          pip install --quiet semgrep==1.175.0
          python3 scripts/authorization-rule.py
      - name: Audit the dependency graph
        # Installed rather than run through an action: every action here is
        # SHA-pinned and Dependabot-tracked (#182), and adding one more
        # third party that runs before our code does, in a job holding a
        # token, is a worse trade than a two-minute build the cache covers.
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
      - name: Check the Complement ratchet
        run: python3 scripts/complement-check-test.py

      # The Synapse fixture builder for #20's importer. Its ordering rules
      # are the part with judgement in them, and they run here against a
      # synthetic Synapse-shaped tree: the one test needing a real checkout
      # skips without SYNAPSE_SOURCE and says so.
      - name: Check the Synapse fixture builder
        run: python3 scripts/synapse-fixture-test.py

      # The alert rules and the dashboard under deploy/ rot silently: a
      # renamed metric leaves a rule that never fires and a panel that
      # draws nothing. This holds every metric they name to metrics.rs and
      # the table in docs/metrics.md (#325).
      - name: Check the observability pack names real metrics
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 scripts/check-observability-pack.py

      # And the same idea for the example config, which had drifted furthest
      # of anything here: 22 of 37 fields had never appeared in it. A setting
      # an operator cannot discover is a setting that does not exist.
      - name: Check the example config documents every setting
        run: python3 scripts/config-drift.py

      # Both Rust homeservers in this space run this. It costs seconds and
      # this repository is unusually prose-heavy: the SPEC, the ADRs and the
      # benchmark write-ups are the artefact as much as the code is.
      - name: Check spelling
        uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1

      # A tag is a pointer somebody else can move, and every action here runs
      # before our code does, in a job holding a token. This ran
      # `dtolnay/rust-toolchain@master` -- a mutable *branch* installing a
      # toolchain -- for its whole history. Pins drift back the moment nothing
      # is watching, so the check ships with them.
      - name: Check actions are pinned to commit SHAs
        run: python3 scripts/actions-pinned.py
