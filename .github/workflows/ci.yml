name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.85.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check code
        run: cargo check --workspace --all-targets
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features

      # The benchmark publishing scripts run on push to main, which is the
      # worst place to find out they are broken: the failure lands after the
      # change is in, and the site keeps serving whatever it served last.
      - name: Check the benchmark publishing tooling
        run: scripts/check-benchmark-tooling.sh

      # Same reasoning for the dashboard: it claims to describe the router,
      # and the claim is only worth reading if a stale copy cannot merge. The
      # generator also fails outright when its curated planned-list names an
      # endpoint the router now serves.
      - name: Check the dashboard matches the router
        run: python3 scripts/coverage-dashboard.py --check

      # And the same idea for the example config, which had drifted furthest
      # of anything here: 22 of 37 fields had never appeared in it. A setting
      # an operator cannot discover is a setting that does not exist.
      - name: Check the example config documents every setting
        run: python3 scripts/config-drift.py

      # Both Rust homeservers in this space run this. It costs seconds and
      # this repository is unusually prose-heavy: the SPEC, the ADRs and the
      # benchmark write-ups are the artefact as much as the code is.
      - name: Check spelling
        uses: crate-ci/typos@a8168dc2984a9e2352f183ffe788f0f23a300389 # v1

      # A tag is a pointer somebody else can move, and every action here runs
      # before our code does, in a job holding a token. This ran
      # `dtolnay/rust-toolchain@master` -- a mutable *branch* installing a
      # toolchain -- for its whole history. Pins drift back the moment nothing
      # is watching, so the check ships with them.
      - name: Check actions are pinned to commit SHAs
        run: python3 scripts/actions-pinned.py
