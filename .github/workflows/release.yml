name: Release

# A tag becomes a release: binaries for the two Linux architectures, a
# checksum file, an SBOM and a signed provenance attestation for each, and
# a container image at ghcr.io/tuna-os/spindle:<tag> with its own
# attestation pushed beside it. The attestations are what let somebody
# check that an artifact really came from this workflow on this commit
# (`gh attestation verify`, see docs/releasing.md) rather than trusting
# the file name; the SBOM says what is inside it.
# ROADMAP.md is the contract for what a tag means; v0.0.x is a prerelease
# that promises nothing, and this workflow marks every v0.* tag as one.
# Cutting the tag is a decision for a person:
#
#   git tag -a v0.0.1 -m "v0.0.1: an addressable prerelease" && git push origin v0.0.1

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  # Sigstore signs the attestations with a short-lived certificate tied to
  # this workflow's OIDC identity; `attestations` is where GitHub stores
  # them so `gh attestation verify` can find them.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.90.0
      - name: Build
        run: cargo build --release -p spindle-server --bin spindle --locked
      - name: Package
        run: |
          name="spindle-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/spindle LICENSE-MIT LICENSE-APACHE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
        id: package
      # The SBOM is read from the tree, so it names every crate Cargo.lock
      # pinned for this build, not just what a scanner can see in a binary.
      - name: Write the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: dist/${{ steps.package.outputs.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the provenance of the tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Attest the SBOM to the tarball
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tar.gz
          sbom-path: dist/${{ steps.package.outputs.name }}.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.spdx.json

  image:
    name: Image for ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the per-architecture image
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker build -t "$image" .
          docker push "$image"
          # The digest is the subject of the attestation: a tag can be moved,
          # a digest cannot.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Pushed to the registry beside the image, so `gh attestation verify
      # oci://...` finds it without the release page.
      - name: Attest the provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish the release
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Join the per-architecture images under the tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker manifest create "$image:${GITHUB_REF_NAME}" \
            "$image:${GITHUB_REF_NAME}-amd64" "$image:${GITHUB_REF_NAME}-arm64"
          docker manifest push "$image:${GITHUB_REF_NAME}"
      - name: Write the notes
        run: |
          {
            echo "Built from \`${GITHUB_SHA}\`."
            echo
            echo "Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}\` (amd64, arm64)."
            echo
            echo "Every tarball and both images carry a Sigstore-signed provenance attestation, and each tarball an SBOM (\`.spdx.json\`) attested to it. To check one came from this workflow on this commit:"
            echo
            echo '```'
            echo "gh attestation verify spindle-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo "gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            case "$GITHUB_REF_NAME" in
              v0.0.*)
                echo "An addressable prerelease, per ROADMAP.md: no upgrade path, no support window, storage format unstable. It exists so that benchmarks, bug reports and security fixes can name a build." ;;
              v0.*)
                echo "A prerelease: see ROADMAP.md for what this line promises and the evidence behind it." ;;
            esac
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease dist/*.tar.gz dist/*.sha256 dist/*.spdx.json
