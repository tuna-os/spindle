# TEMPORARY (feat/matrixrtc-completion): the element-call-e2e job alone, on
# push to this branch, so iterating on the M7 specs does not queue the whole
# compliance matrix. Removed before the branch is merged.
name: Element Call e2e (branch iteration)
on:
  push:
    branches: [feat/matrixrtc-completion]
    paths:
      - ".github/workflows/rtc-e2e-iteration.yml"
      - "contrib/element-call/**"
      - "crates/**"
  workflow_dispatch:
    inputs:
      element_call_specs:
        required: false
        default: ""
permissions:
  contents: read
jobs:
  element-call-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Spindle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image
      - name: Check out Element Call at the pin
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^ELEMENT_CALL_REV=//p' contrib/element-call/run.sh)
          git clone --quiet https://github.com/element-hq/element-call.git tmp/element-call
          git -C tmp/element-call checkout --quiet "$rev"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tmp/element-call/.node-version
      - name: Run the suite against Spindle
        env:
          SPINDLE_IMAGE: complement-spindle:latest
          ELEMENT_CALL_SRC: tmp/element-call
          ELEMENT_CALL_SPECS: ${{ github.event.inputs.element_call_specs }}
        run: contrib/element-call/run.sh tmp/element-call-results/results.json
      - name: Keep the report and the server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: element-call-e2e
          path: |
            tmp/element-call-results/
            tmp/element-call/playwright-report/
          if-no-files-found: ignore

