# TEMPORARY (feat/matrixrtc-completion): the element-call-e2e job alone, on
# push to this branch, so iterating on the M7 specs does not queue the whole
# compliance matrix. Removed before the branch is merged.
name: Element Call e2e (branch iteration)
on:
  push:
    branches: [feat/matrixrtc-completion]
    paths:
      - ".github/workflows/rtc-e2e-iteration.yml"
      - "contrib/element-call/**"
      - "crates/**"
      - "scripts/delayed-events-benchmark.py"
      - "scripts/bench-servers.sh"
  workflow_dispatch:
    inputs:
      element_call_specs:
        required: false
        default: ""
permissions:
  contents: read
jobs:
  element-call-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Spindle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image
      - name: Check out Element Call at the pin
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^ELEMENT_CALL_REV=//p' contrib/element-call/run.sh)
          git clone --quiet https://github.com/element-hq/element-call.git tmp/element-call
          git -C tmp/element-call checkout --quiet "$rev"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tmp/element-call/.node-version
      - name: Run the suite against Spindle
        env:
          SPINDLE_IMAGE: complement-spindle:latest
          ELEMENT_CALL_SRC: tmp/element-call
          ELEMENT_CALL_SPECS: ${{ github.event.inputs.element_call_specs }}
        run: contrib/element-call/run.sh tmp/element-call-results/results.json
      - name: Keep the report and the server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: element-call-e2e
          path: |
            tmp/element-call-results/
            tmp/element-call/playwright-report/
          if-no-files-found: ignore


  # #36's comparison: the delayed-event measurements over HTTP against
  # Spindle and against Synapse (the field pin, Postgres, MSC4140 on) on
  # one runner in one sitting.
  delayed-events-vs-synapse:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Spindle, release build
        run: cargo build --release -p spindle-server --bin spindle
      - name: Synapse at the field pin
        run: |
          set -euo pipefail
          version=$(sed -n 's/^SYNAPSE_VERSION=//p' scripts/bench-field.sh)
          python3 -m venv tmp/synvenv
          tmp/synvenv/bin/pip install --quiet "matrix-synapse==$version" "psycopg2-binary==2.9.10"
      - name: Postgres, as Synapse's own docs run it
        run: |
          docker run -d --name bench-pg -e POSTGRES_USER=bench -e POSTGRES_PASSWORD=bench \
            -p 127.0.0.1:5433:5432 postgres:16-alpine
          for _ in $(seq 1 60); do
            pg_isready -h 127.0.0.1 -p 5433 -U bench >/dev/null 2>&1 && break
            sleep 1
          done
          sleep 3
      - name: Both servers, cold
        env:
          SYNAPSE_VENV: tmp/synvenv
          BENCH_BIN: tmp/none
          BENCH_PG_URL: postgresql://bench:bench@127.0.0.1:5433/postgres
        run: |
          mkdir -p tmp/none
          scripts/bench-servers.sh up
      - name: Measure
        run: |
          set -euo pipefail
          python3 scripts/delayed-events-benchmark.py --base http://127.0.0.1:8099 \
            --label spindle --out tmp/delayed/spindle.json
          python3 scripts/delayed-events-benchmark.py --base http://127.0.0.1:8098 \
            --label synapse --out tmp/delayed/synapse.json
      - name: Keep the results and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delayed-events-vs-synapse
          path: |
            tmp/delayed/
            tmp/bench/*.log
          if-no-files-found: ignore
