# TEMPORARY: drop this file before the branch merges.
#
# Builds the release Dockerfile (no extra features) for amd64 from the
# perf/concurrent-remote-keys branch and pushes it as
# ghcr.io/tuna-os/spindle:perf-723-<shortsha>, so the #723 fix can be tried
# on the reilly.asia deployment. amd64 only: the cluster's nodes are x86.
name: Perf image

on:
  push:
    branches: [perf/concurrent-remote-keys]

permissions:
  contents: read
  packages: write

concurrency:
  group: perf-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:perf-723-${GITHUB_SHA::7}"
          docker build -t "$image" .
          docker run --rm --entrypoint /usr/local/bin/spindle "$image" --help 2>&1 | head -5 || true
          docker push "$image" | tee push.txt
          digest=$(grep -o 'sha256:[0-9a-f]*' push.txt | tail -1)
          echo "Image: \`${image%%:*}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "IMAGE ${image%%:*}@${digest}"
