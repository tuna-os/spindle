name: Matrix compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  protocol-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Matrix protocol compliance fixtures
        run: cargo test --test matrix_compliance

      # The Synapse reader is behind a non-default feature, so the workspace
      # gate never compiles it -- which is exactly how a parked module rots.
      # This builds and runs it. No Synapse checkout is cloned: the one test
      # that needs real DDL skips itself, and the rest carry the shapes that
      # actually bite (a legacy is_state edge, an edge with a NULL room_id).
      - name: Check the Synapse reader still builds and passes
        run: cargo test --features synapse-import --test synapse_reader

  complement-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require Complement assets once the server crate lands
        shell: bash
        run: |
          if [[ -f crates/spindle-server/Cargo.toml ]]; then
            test -f complement/Dockerfile
            test -f complement/allowlist.txt
            test -x complement/entrypoint.sh
          fi

      # File existence is not the contract. Complement's startup contract is
      # that the image builds, comes up from SERVER_NAME and a mounted CA, and
      # answers /_matrix/client/versions -- so that is what is checked, rather
      # than that somebody committed a Dockerfile.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''

      # The image's dependency layer is keyed on Cargo.lock alone, so it is
      # the same layer on every run until a dependency actually moves. A
      # runner has no layer cache of its own, so without importing one the
      # split in complement/Dockerfile buys nothing: this is the half that
      # makes it pay.
      #
      # Import only. This job and complement-suite build the same image
      # from the same context and run concurrently, so having both export
      # means paying the upload twice and racing to write the same key for
      # no benefit. The suite is the longer job and the one whose build
      # blocks more, so it owns the export and this one consumes it.
      - name: Build the Complement image
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:ci
          load: true
          cache-from: type=gha,scope=complement-image

      - name: Start it the way Complement does
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ca
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ca/ca.key -out ca/ca.crt -subj "/CN=Complement CA"
          docker run -d --name spindle-ci \
            -e SERVER_NAME=hs1 \
            -v "$PWD/ca:/complement/ca:ro" \
            -p 18008:8008 \
            complement-spindle:ci

          # Wait on the image's own HEALTHCHECK, which is what Complement waits
          # on. A container that never reports healthy is the failure mode this
          # job exists to catch -- but "exited" and "probe failing" are different
          # faults with different fixes, and reporting them as one sends whoever
          # reads this looking in the wrong place.
          for _ in $(seq 1 60); do
            running=$(docker inspect -f '{{.State.Running}}' spindle-ci 2>/dev/null || echo false)
            if [[ "$running" != true ]]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' spindle-ci 2>/dev/null || echo '?')
              echo "::error::the container exited with code $code before becoming healthy"
              docker logs spindle-ci || true
              exit 1
            fi
            state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci 2>/dev/null || echo starting)
            [[ "$state" == healthy ]] && break
            sleep 2
          done
          docker logs spindle-ci
          state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci)
          if [[ "$state" != healthy ]]; then
            echo "::error::container is running but the health check never passed ($state)"
            docker inspect -f '{{json .State.Health}}' spindle-ci || true
            exit 1
          fi

      - name: Check the endpoint Complement probes
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        run: |
          set -euo pipefail
          curl -fsS http://localhost:18008/_matrix/client/versions | tee /dev/stderr | grep -q '"versions"'

      # #11 requires a non-root runtime, and an image that quietly runs as root
      # is the kind of thing nobody notices until it is deployed somewhere real.
      #
      # PID 1, not `id -u`: the image has no USER directive, because setup has
      # to read Complement's 0600 CA key. `docker exec` would therefore report
      # root and prove nothing. What matters is the process that stays up, which
      # the entrypoint exec's into after dropping privileges.
      - name: Check the server process does not run as root
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        run: |
          set -euo pipefail
          uid=$(docker exec spindle-ci stat -c '%u' /proc/1)
          comm=$(docker exec spindle-ci cat /proc/1/comm)
          echo "pid 1 is '$comm' running as uid $uid"
          test "$comm" = spindle
          test "$uid" = "10001"

      # Complement starts the image repeatedly from the same entrypoint, so a
      # second run over existing storage has to work too.
      - name: Check it restarts over its own storage
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        run: |
          set -euo pipefail
          docker restart spindle-ci
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci 2>/dev/null || echo starting)
            [[ "$state" == healthy ]] && break
            sleep 2
          done
          docker logs --tail 20 spindle-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' spindle-ci)" = healthy

      - name: Missing SERVER_NAME must fail loudly
        if: hashFiles('crates/spindle-server/Cargo.toml') != ''
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm -v "$PWD/ca:/complement/ca:ro" complement-spindle:ci; then
            echo "started without SERVER_NAME, which should be impossible"
            exit 1
          fi

      - name: Collect logs on failure
        if: failure()
        run: docker logs spindle-ci || true

  # The Complement ratchet (#62, docs/conformance-testing.md §3): the real
  # suite, upstream and pinned, against the real image. Pull requests run the
  # protected subset — every allowlisted test must pass, and quickly, because
  # this gates every merge. Pushes to main run the whole suite, so newly
  # passing tests surface as candidates on a cadence where a human promotes
  # them deliberately; a flaky test promoted automatically would teach
  # everyone to ignore this gate.
  complement-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          # setup-go's own cache keys off a go.sum, and this repository has
          # none: the Go code under test is Complement's, cloned at a pin by
          # scripts/complement.sh. The cache below does the same job keyed on
          # that pin instead.
          cache: false

      # Complement is the same source at the same revision on every run, so
      # recompiling it every run is pure waste — roughly a minute of module
      # downloads and compilation before a single test can start. Keyed on
      # complement.sh because that is where COMPLEMENT_REV lives: bump the
      # pin and the key changes with it, so a stale build is never reused.
      - name: Cache the Complement checkout and Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/complement-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: complement-${{ runner.os }}-${{ hashFiles('scripts/complement.sh') }}
          restore-keys: complement-${{ runner.os }}-

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Built here rather than inside complement.sh so the layer cache
      # applies; the script skips its own build when COMPLEMENT_IMAGE is
      # already set, which is exactly what that variable is for.
      - name: Build the Complement image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image
          cache-to: type=gha,mode=max,scope=complement-image

      - name: Compute the protected-subset filter for pull requests
        if: github.event_name == 'pull_request'
        run: |
          echo "COMPLEMENT_RUN=$(python3 scripts/complement-check.py --print-run-filter x)" >> "$GITHUB_ENV"

      - name: Run Complement
        # The pipe in GOPROXY is load-bearing: it tells Go to fall back to
        # direct module fetches on ANY proxy error, where the default comma
        # only falls back on 404/410. proxy.golang.org has failed mid-stream
        # ("stream error … INTERNAL_ERROR") twice on this runner class,
        # which makes `go test` report the whole package as [setup failed]
        # and every test in it as absent.
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
        run: scripts/complement.sh tmp/complement-results.jsonl

      - name: Enforce the allowlist
        run: python3 scripts/complement-check.py tmp/complement-results.jsonl

      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: complement-results
          path: tmp/complement-results.jsonl
          if-no-files-found: ignore
