name: Matrix compliance

on:
  pull_request:
  push:
    branches: [main]
  # The whole suite, once a night, whether or not main moved (#25 asks for
  # a nightly full run with retained logs; the push run above only covers
  # days something merged, and only a slice of the heavy rigs). Off the
  # hour so it does not queue behind every other project's on-the-hour
  # job. The protected-subset filter below is keyed on the pull_request
  # event, and the plan job starts every rig on a schedule, so a scheduled
  # run is a full one.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      element_call_specs:
        description: >-
          Element Call spec files for the element-call-e2e job, space
          separated and relative to upstream's playwright/ directory.
          Empty runs the default subset in contrib/element-call/run.sh.
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run starts, decided by scripts/compliance-plan.sh. A pull
  # request or push that touches only prose (Markdown, docs/) starts this
  # job and nothing else: the Prose workflow and CI's checks are what read
  # it. A push to main runs the per-PR jobs plus a rotating slice of the
  # three heavy rigs (element-call-e2e, mesh-seam, rust-sdk-suite) --
  # COMPLIANCE_ROUND_ROBIN_SIZE of them, a repository variable, one when
  # unset, turned by the run number -- and the nightly and dispatched runs
  # start all of them. Sixty runners are shared by every project in the
  # organization, and twelve jobs on every merge was a queue of its own.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.plan.outputs.code }}
      rotation: ${{ steps.plan.outputs.rotation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/compliance-plan.sh
          sparse-checkout-cone-mode: false
      - name: Decide what runs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          SIZE: ${{ vars.COMPLIANCE_ROUND_ROBIN_SIZE }}
        run: |
          scripts/compliance-plan.sh
          cat "$GITHUB_OUTPUT"

  # Every rig that needs no more than a debug build of the server, in one
  # job so the server is built once rather than once a rig. Pull requests
  # run the protocol fixtures, Element Web and synadm; pushes, nightly and
  # dispatch add the bridges and the full-mesh call. Each rig runs whether
  # or not the one before it passed, so one red rig does not hide another.
  #
  # The protocol fixtures: the compliance test file, no server process.
  #
  # Two people meet in a room through Element Web, on a Spindle that was
  # empty a moment ago (docs/conformance-testing.md, section 4.1). Complement
  # proves the API; this proves the client the API is for: register, log
  # in, create a room, invite, accept, a message each way, leave, driven
  # through a pinned Element Web release in a real browser.
  #
  # synadm, the Synapse admin CLI, against the /_synapse/admin alias: the
  # question "does tooling written for Synapse drive this server?" asked
  # with the tool itself (contrib/synadm).
  #
  # A real bridge: matrix-hookshot through the Application Service API,
  # invited, joined, answering a command and relaying a webhook into the
  # room from a ghost it minted (contrib/hookshot). The bridge evidence #18
  # asks for, one bridge at a time. Beside it the mautrix-go harness under
  # evidence/: a bridge written against the library most bridges are
  # written against, registering, provisioning ghosts, echoing. Its
  # transcript is in docs/evidence; this keeps the transcript true.
  #
  # A peer-to-peer call with no SFU anywhere: Element Call's frozen
  # full-mesh branch, built at its last commit and pointed at a Spindle,
  # two browsers meeting in a call over a host-to-host candidate pair
  # (docs/p2p-calls.md). Not per pull request, because building the branch
  # is a yarn install and a vite build of a 2023 tree.
  debug-rigs:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'pull_request'
        with:
          go-version-file: evidence/mautrix-echo/go.mod
          cache-dependency-path: evidence/mautrix-echo/go.sum
      - name: Run Matrix protocol compliance fixtures
        run: cargo test --test matrix_compliance

      # The Synapse reader is behind a non-default feature, so the workspace
      # gate never compiles it -- which is exactly how a parked module rots.
      # This builds and runs it. No Synapse checkout is cloned: the one test
      # that needs real DDL skips itself, and the rest carry the shapes that
      # actually bite (a legacy is_state edge, an edge with a NULL room_id).
      - name: Check the Synapse reader still builds and passes
        if: ${{ !cancelled() }}
        run: cargo test --features synapse-import --test synapse_reader

      - name: Build the server
        id: build
        if: ${{ !cancelled() }}
        run: cargo build -p spindle-server --bin spindle
      - name: Install the pinned Playwright and its Chromium
        id: playwright
        if: ${{ !cancelled() }}
        working-directory: scripts/element-web-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Meet in a room through Element Web
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' }}
        env:
          SPINDLE_BIN: target/debug/spindle
        run: scripts/element-web-e2e/run.sh

      - name: Install synadm
        id: synadm
        if: ${{ !cancelled() }}
        run: pip install --quiet synadm==0.49.2
      - name: Drive the admin API the way an operator does
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.synadm.outcome == 'success' }}
        env:
          SPINDLE_BIN: target/debug/spindle
        run: contrib/synadm/run.sh

      - name: Bridge a webhook through hookshot
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outcome == 'success' }}
        env:
          SPINDLE_BIN: target/debug/spindle
        run: contrib/hookshot/run.sh
      - name: Run the mautrix-echo harness against a fresh build
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: evidence/mautrix-echo/run.sh

      - name: Meet in a peer-to-peer call
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.build.outcome == 'success' && steps.playwright.outcome == 'success' }}
        env:
          SPINDLE_BIN: target/debug/spindle
        run: contrib/element-call-full-mesh/run.sh

      - name: Keep the screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-rigs
          path: |
            tmp/element-web-e2e/
            tmp/synadm/
            tmp/hookshot/
            tmp/element-call-full-mesh/
          if-no-files-found: ignore

  # The Complement ratchet (#62, docs/conformance-testing.md §3): the real
  # suite, upstream and pinned, against the real image. Pull requests run the
  # protected subset — every allowlisted test must pass, and quickly, because
  # this gates every merge. Pushes to main run the whole suite, so newly
  # passing tests surface as candidates on a cadence where a human promotes
  # them deliberately; a flaky test promoted automatically would teach
  # everyone to ignore this gate.
  #
  # One job for everything that runs against the Complement image -- the
  # image's own startup contract, the suite, and the state-resolution
  # interop rooms -- so the image is built once. Building it is most of
  # the time each of them took on its own. After the build each part runs
  # whether or not the one before it passed, so a red readiness check does
  # not hide the suite's ledger.
  complement-suite:
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          # setup-go's own cache keys off a go.sum, and this repository has
          # none: the Go code under test is Complement's, cloned at a pin by
          # scripts/complement.sh. The cache below does the same job keyed on
          # that pin instead.
          cache: false

      # Complement is the same source at the same revision on every run, so
      # recompiling it every run is pure waste — roughly a minute of module
      # downloads and compilation before a single test can start. Keyed on
      # complement.sh because that is where COMPLEMENT_REV lives: bump the
      # pin and the key changes with it, so a stale build is never reused.
      - name: Cache the Complement checkout and Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/complement-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: complement-${{ runner.os }}-${{ hashFiles('scripts/complement.sh') }}
          restore-keys: complement-${{ runner.os }}-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built here rather than inside complement.sh so the layer cache
      # applies; the script skips its own build when COMPLEMENT_IMAGE is
      # already set, which is exactly what that variable is for.

      # Built here rather than inside complement.sh so the layer cache
      # applies; the script skips its own build when COMPLEMENT_IMAGE is
      # already set, which is exactly what that variable is for. The
      # dependency layer is keyed on Cargo.lock alone, so it is the same
      # layer on every run until a dependency actually moves; a runner has
      # no layer cache of its own, so this job exports one and the nightly
      # jobs below import it.
      - name: Build the Complement image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image
          cache-to: type=gha,mode=max,scope=complement-image

      # Complement's startup contract is that the image builds, comes up
      # from SERVER_NAME and a mounted CA, and answers
      # /_matrix/client/versions -- so that is what is checked, rather than
      # that somebody committed a Dockerfile.
      - name: Require the Complement assets
        run: |
          test -f complement/Dockerfile
          test -f complement/allowlist.txt
          test -x complement/entrypoint.sh

      - name: Start it the way Complement does
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ca
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout ca/ca.key -out ca/ca.crt -subj "/CN=Complement CA"
          docker run -d --name spindle-ci \
            -e SERVER_NAME=hs1 \
            -v "$PWD/ca:/complement/ca:ro" \
            -p 18008:8008 \
            complement-spindle:latest

          # Wait on the image's own HEALTHCHECK, which is what Complement waits
          # on. A container that never reports healthy is the failure mode this
          # job exists to catch -- but "exited" and "probe failing" are different
          # faults with different fixes, and reporting them as one sends whoever
          # reads this looking in the wrong place.
          for _ in $(seq 1 60); do
            running=$(docker inspect -f '{{.State.Running}}' spindle-ci 2>/dev/null || echo false)
            if [[ "$running" != true ]]; then
              code=$(docker inspect -f '{{.State.ExitCode}}' spindle-ci 2>/dev/null || echo '?')
              echo "::error::the container exited with code $code before becoming healthy"
              docker logs spindle-ci || true
              exit 1
            fi
            state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci 2>/dev/null || echo starting)
            [[ "$state" == healthy ]] && break
            sleep 2
          done
          docker logs spindle-ci
          state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci)
          if [[ "$state" != healthy ]]; then
            echo "::error::container is running but the health check never passed ($state)"
            docker inspect -f '{{json .State.Health}}' spindle-ci || true
            exit 1
          fi

      - name: Check the endpoint Complement probes
        run: |
          set -euo pipefail
          curl -fsS http://localhost:18008/_matrix/client/versions | tee /dev/stderr | grep -q '"versions"'

      # #11 requires a non-root runtime, and an image that quietly runs as root
      # is the kind of thing nobody notices until it is deployed somewhere real.
      #
      # PID 1, not `id -u`: the image has no USER directive, because setup has
      # to read Complement's 0600 CA key. `docker exec` would therefore report
      # root and prove nothing. What matters is the process that stays up, which
      # the entrypoint exec's into after dropping privileges.
      - name: Check the server process does not run as root
        run: |
          set -euo pipefail
          uid=$(docker exec spindle-ci stat -c '%u' /proc/1)
          comm=$(docker exec spindle-ci cat /proc/1/comm)
          echo "pid 1 is '$comm' running as uid $uid"
          test "$comm" = spindle
          test "$uid" = "10001"

      # Complement starts the image repeatedly from the same entrypoint, so a
      # second run over existing storage has to work too.
      - name: Check it restarts over its own storage
        run: |
          set -euo pipefail
          docker restart spindle-ci
          for _ in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Health.Status}}' spindle-ci 2>/dev/null || echo starting)
            [[ "$state" == healthy ]] && break
            sleep 2
          done
          docker logs --tail 20 spindle-ci
          test "$(docker inspect -f '{{.State.Health.Status}}' spindle-ci)" = healthy

      - name: Missing SERVER_NAME must fail loudly
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm -v "$PWD/ca:/complement/ca:ro" complement-spindle:latest; then
            echo "started without SERVER_NAME, which should be impossible"
            exit 1
          fi

      - name: Collect the readiness container's logs on failure
        if: failure()
        run: docker logs spindle-ci || true

      - name: Stop the readiness container
        if: always()
        run: docker rm -f spindle-ci || true

      - name: Compute the protected-subset filter for pull requests
        id: filter
        if: ${{ !cancelled() && steps.image.outcome == 'success' && github.event_name == 'pull_request' }}
        run: |
          echo "run=$(python3 scripts/complement-check.py --print-run-filter x)" >> "$GITHUB_OUTPUT"

      - name: Run Complement
        id: complement
        # A failed filter step must not turn a pull request's run into the
        # whole suite.
        if: ${{ !cancelled() && steps.image.outcome == 'success' && steps.filter.outcome != 'failure' }}
        # The pipe in GOPROXY is load-bearing: it tells Go to fall back to
        # direct module fetches on ANY proxy error, where the default comma
        # only falls back on 404/410. proxy.golang.org has failed mid-stream
        # ("stream error … INTERNAL_ERROR") twice on this runner class,
        # which makes `go test` report the whole package as [setup failed]
        # and every test in it as absent.
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
          # Empty outside pull requests, which is the whole suite.
          COMPLEMENT_RUN: ${{ steps.filter.outputs.run }}
        run: scripts/complement.sh tmp/complement-results.jsonl

      - name: Enforce the allowlist
        if: ${{ !cancelled() && steps.complement.outcome == 'success' }}
        run: python3 scripts/complement-check.py tmp/complement-results.jsonl

      - name: Keep the ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complement-results
          path: tmp/complement-results.jsonl
          if-no-files-found: ignore

      # Contested forks against a real Synapse (#563, ADR 0005): Complement's
      # fake server forks a room six ways -- power levels, a ban against the
      # banned member's write, a join against a join-rule change -- sends the
      # branches to Spindle (hs1) and Synapse (hs2) in opposite orders, and the
      # two must end on the same state. Run homogeneously first, Spindle on both
      # ends, so a failure says which pairing broke. Per pull request, unlike the
      # full interop run: it is five rooms, not the suite, and agreeing with
      # Synapse on a fork is a property every change to ingest has to keep.
      - name: Spindle beside Spindle
        id: state-res-homogeneous
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
          COMPLEMENT_PACKAGES: ./tests/spindle
          COMPLEMENT_RUN: TestContestedForkResolvesLikeThePeer
        run: scripts/complement.sh tmp/state-res-homogeneous.jsonl

      - name: Spindle beside Synapse
        id: state-res-interop
        if: ${{ !cancelled() && steps.state-res-homogeneous.outcome == 'success' }}
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
          COMPLEMENT_INTEROP_IMAGE: ghcr.io/element-hq/synapse/complement-synapse:latest
          COMPLEMENT_INTEROP_HS: hs2
          COMPLEMENT_PACKAGES: ./tests/spindle
          COMPLEMENT_RUN: TestContestedForkResolvesLikeThePeer
        run: scripts/complement.sh tmp/state-res-interop.jsonl

      - name: Require every room version to agree
        if: ${{ !cancelled() && steps.state-res-interop.outcome == 'success' }}
        run: |
          python3 scripts/complement-require.py TestContestedForkResolvesLikeThePeer \
            tmp/state-res-homogeneous.jsonl tmp/state-res-interop.jsonl

      - name: Keep the ledgers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-resolution-interop
          path: tmp/state-res-*.jsonl
          if-no-files-found: ignore

  # MSC3995 hub mode against a real Synapse (#22, SPEC section 12.6). The
  # image is built with the `hub-mode` feature and `[federation.hub]` on.
  # Beside a second hub-mode Spindle, hs2's events go through hs1 as the
  # room's hub; beside Synapse, which knows nothing of hub mode, the room
  # must stay an ordinary Matrix room: every event accepted on both sides,
  # the same state. Nightly and on demand, like the full interop run: the
  # feature is off by default and off in production.
  hub-mode-interop:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Cache the Complement checkout and Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/complement-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: complement-${{ runner.os }}-${{ hashFiles('scripts/complement.sh') }}
          restore-keys: complement-${{ runner.os }}-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the hub-mode Complement image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle-hub:latest
          load: true
          build-args: |
            SPINDLE_FEATURES=hub-mode
            SPINDLE_HUB_MODE=1
          cache-from: type=gha,scope=complement-image

      - name: Hub-mode Spindle beside hub-mode Spindle
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle-hub:latest
          COMPLEMENT_PACKAGES: ./tests/spindle
          COMPLEMENT_RUN: TestHubModeRoomStaysOrdinary
        run: scripts/complement.sh tmp/hub-mode-homogeneous.jsonl

      - name: Hub-mode Spindle beside Synapse
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle-hub:latest
          COMPLEMENT_INTEROP_IMAGE: ghcr.io/element-hq/synapse/complement-synapse:latest
          COMPLEMENT_INTEROP_HS: hs2
          COMPLEMENT_PACKAGES: ./tests/spindle
          COMPLEMENT_RUN: TestHubModeRoomStaysOrdinary
        run: scripts/complement.sh tmp/hub-mode-interop.jsonl

      - name: Require the hub room to stay ordinary in both
        run: |
          python3 scripts/complement-require.py TestHubModeRoomStaysOrdinary \
            tmp/hub-mode-homogeneous.jsonl tmp/hub-mode-interop.jsonl

      - name: Keep the ledgers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hub-mode-interop
          path: tmp/hub-mode-*.jsonl
          if-no-files-found: ignore

  # Heterogeneous federation against a real Synapse (docs/conformance-testing.md
  # §5.1, #16): the suite above, unchanged, with Element's Complement image
  # of Synapse on the other end of the wire. Report-only, as tuwunel runs
  # it, because a heterogeneous result set legitimately differs from the
  # homogeneous one: rather than a gate, the job diffs its ledger against
  # the baseline complement-suite just produced from the same commit and
  # sorts what differs into shared gaps, peer-side false positives and
  # genuine interop regressions (scripts/complement-interop.py), with the
  # report on the run's summary page. Nightly and on demand only: an hour
  # of Docker against a moving image is not a per-PR cost, and `latest` is
  # deliberate -- the digest the run federated with is in its log, and a
  # Synapse change that breaks interop should show up here first, not in
  # someone's deployment.
  #
  # Two jobs rather than one matrix, though they differ in one variable: a
  # job skipped by its `if` never expands its matrix, so on every pull
  # request the skipped row would read as a literal `matrix.name`.
  compliance-interop:
    # Not `needs` alone: the suite job fails on a ratchet regression, and
    # its ledger is uploaded either way, so a red baseline is still a
    # baseline. Only a cancelled run has nothing to compare against.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: complement-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Cache the Complement checkout and Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/complement-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: complement-${{ runner.os }}-${{ hashFiles('scripts/complement.sh') }}
          restore-keys: complement-${{ runner.os }}-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Import only, from the layer cache the suite job exported.
      - name: Build the Complement image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image

      - name: Fetch the homogeneous baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: complement-results
          path: tmp/baseline

      - name: Run Complement with Synapse as hs2
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
          COMPLEMENT_INTEROP_IMAGE: ghcr.io/element-hq/synapse/complement-synapse:latest
          COMPLEMENT_INTEROP_HS: hs2
        run: scripts/complement.sh tmp/compliance-interop.jsonl

      - name: Read the run against the baseline
        run: |
          python3 scripts/complement-interop.py \
            --baseline tmp/baseline/complement-results.jsonl \
            --interop tmp/compliance-interop.jsonl \
            --peer "synapse as hs2" \
            --report tmp/compliance-interop.md
          cat tmp/compliance-interop.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the ledger and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-interop
          path: |
            tmp/compliance-interop.jsonl
            tmp/compliance-interop.md
          if-no-files-found: ignore

  # The inverse pairing: Synapse is hs1 and drives, Spindle answers. Which
  # side drives a federation test changes what it exercises, so both
  # directions run -- and here single-server tests exercise Synapse alone,
  # which the report header says.
  compliance-interop-inverse:
    # Not `needs` alone: the suite job fails on a ratchet regression, and
    # its ledger is uploaded either way, so a red baseline is still a
    # baseline. Only a cancelled run has nothing to compare against.
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: complement-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Cache the Complement checkout and Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            tmp/complement-src
            ~/.cache/go-build
            ~/go/pkg/mod
          key: complement-${{ runner.os }}-${{ hashFiles('scripts/complement.sh') }}
          restore-keys: complement-${{ runner.os }}-

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Import only, from the layer cache the suite job exported.
      - name: Build the Complement image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image

      - name: Fetch the homogeneous baseline
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: complement-results
          path: tmp/baseline

      - name: Run Complement with Synapse as hs1
        env:
          GOPROXY: https://proxy.golang.org|direct
          COMPLEMENT_IMAGE: complement-spindle:latest
          COMPLEMENT_INTEROP_IMAGE: ghcr.io/element-hq/synapse/complement-synapse:latest
          COMPLEMENT_INTEROP_HS: hs1
        run: scripts/complement.sh tmp/compliance-interop-inverse.jsonl

      - name: Read the run against the baseline
        run: |
          python3 scripts/complement-interop.py \
            --baseline tmp/baseline/complement-results.jsonl \
            --interop tmp/compliance-interop-inverse.jsonl \
            --peer "synapse as hs1" \
            --report tmp/compliance-interop-inverse.md
          cat tmp/compliance-interop-inverse.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the ledger and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-interop-inverse
          path: |
            tmp/compliance-interop-inverse.jsonl
            tmp/compliance-interop-inverse.md
          if-no-files-found: ignore

  # Element Call's own Playwright suite with Spindle in Synapse's seat
  # (#269, the acceptance gate #41 asks for): upstream's two-homeserver
  # stack, unforked and pinned, driven by their specs through a real
  # browser. Nightly, on demand and in its turn on main (the plan job)
  # rather than per pull request, because it pulls six upstream images and
  # builds Element Call, and because the ratchet it enforces
  # (contrib/element-call/allowlist.txt) starts empty:
  # the rig was authored without a Docker host to run it on, so the first
  # recorded run is what fills it in. Until an entry is protected the check
  # cannot fail on a spec, only on the stack not coming up -- which is a
  # finding worth a red run, so it is not continue-on-error.
  element-call-e2e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.rotation), 'element-call-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the Spindle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: complement/Dockerfile
          tags: complement-spindle:latest
          load: true
          cache-from: type=gha,scope=complement-image
      - name: Check out Element Call at the pin
        run: |
          set -euo pipefail
          rev=$(sed -n 's/^ELEMENT_CALL_REV=//p' contrib/element-call/run.sh)
          git clone --quiet https://github.com/element-hq/element-call.git tmp/element-call
          git -C tmp/element-call checkout --quiet "$rev"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tmp/element-call/.node-version
      - name: Run the suite against Spindle
        env:
          SPINDLE_IMAGE: complement-spindle:latest
          ELEMENT_CALL_SRC: tmp/element-call
          ELEMENT_CALL_SPECS: ${{ inputs.element_call_specs }}
        run: contrib/element-call/run.sh tmp/element-call-results/results.json
      - name: Keep the report and the server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: element-call-e2e
          path: |
            tmp/element-call-results/
            tmp/element-call/playwright-report/
          if-no-files-found: ignore

  # The mesh seam, nightly and in its turn on main: a Neutrino node built
  # from the fork at the pinned revision with contrib/neutrino's patches,
  # beside a Spindle, run
  # through scripts/neutrino-interop.sh against the table it is expected
  # to produce, then Element Call's full-mesh client in a call with the
  # creator on the node (docs/p2p-calls.md). Not on pull requests: two
  # extra Rust trees to build, and nothing on the seam can regress from a
  # change to this repository alone.
  mesh-seam:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.rotation), 'mesh-seam')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            tmp/neutrino-iroh -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check out the fork at the pin and apply the patches
        # Fetched into directories that may already hold a restored
        # `target/` from the cache, so not `git clone`, which refuses a
        # non-empty destination.
        run: |
          fetch() {
            mkdir -p "$1"
            git -C "$1" init --quiet
            git -C "$1" fetch --quiet --depth 1 "$2" "$3"
            git -C "$1" checkout --quiet FETCH_HEAD
          }
          fetch tmp/neutrino https://github.com/hanthor/neutrino 3fb6945f8b17d7d9f7ae4814d3939238ceef21e9
          git -C tmp/neutrino -c user.name=ci -c user.email=ci@localhost \
            am "$GITHUB_WORKSPACE"/contrib/neutrino/000{1,2,3}-*.patch
          fetch tmp/neutrino-iroh https://github.com/hanthor/neutrino-iroh 6a16f66bf6b247c41977958a4750ae735dc24a2a
          cat >> tmp/neutrino-iroh/Cargo.toml <<'TOML'

          [patch."https://github.com/hanthor/neutrino"]
          neutrino-ffi = { path = "../neutrino/crates/neutrino-ffi" }
          neutrino-main = { path = "../neutrino/crates/neutrino-main" }
          TOML
      - name: Build the node
        run: cargo build --release --manifest-path tmp/neutrino-iroh/Cargo.toml -p neutrino-ffi-ble --bin neutrino-lan
      - name: Build the server
        run: cargo build --release -p spindle-server --bin spindle
      - name: Probe the seam against the expected table
        env:
          EXPECT: scripts/testdata/neutrino-interop.expected
          NEUTRINO_LAN: tmp/neutrino-iroh/target/release/neutrino-lan
          SPINDLE_BIN: target/release/spindle
        run: scripts/neutrino-interop.sh
      - name: Install the pinned Playwright and its Chromium
        working-directory: scripts/element-web-e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Meet in a peer-to-peer call across the seam
        env:
          NEUTRINO_LAN: tmp/neutrino-iroh/target/release/neutrino-lan
          SPINDLE_BIN: target/release/spindle
        run: contrib/element-call-full-mesh/run.sh
      - name: Keep the screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mesh-seam
          path: |
            tmp/element-call-full-mesh/
            /tmp/neutrino-interop-*/*.log
          if-no-files-found: ignore

  # matrix-rust-sdk's own integration suite, nightly: the library under
  # Element X, driving Spindle the way the flagship client does, with the
  # allowlist in contrib/rust-sdk as the ratchet. Not on pull requests:
  # the suite's build is a workspace of its own. Pushes to main run it in
  # its turn (the plan job). Its job id is the context branch protection
  # requires: skipped on a pull request reads as passed, and renaming it
  # leaves every pull request waiting on a check that never reports.
  rust-sdk-suite:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.rotation), 'rust-sdk-suite')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            . -> target
            tmp/matrix-rust-sdk -> target
      - name: Check out matrix-rust-sdk at the pin
        run: |
          rev=$(sed -n 's/^RUST_SDK_REV=\([0-9a-f]*\).*/\1/p' contrib/rust-sdk/run.sh)
          mkdir -p tmp/matrix-rust-sdk
          git -C tmp/matrix-rust-sdk init -q
          git -C tmp/matrix-rust-sdk fetch -q --depth 1 https://github.com/matrix-org/matrix-rust-sdk.git "$rev"
          git -C tmp/matrix-rust-sdk checkout -q FETCH_HEAD
      - name: Build the server
        run: cargo build --release -p spindle-server --bin spindle
      # The SDK's floor is above this repository's pin; a second toolchain
      # for its build alone, named to the rig rather than changing the pin.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.96.0
      - name: Run the suite against Spindle
        env:
          RUST_SDK_SRC: tmp/matrix-rust-sdk
          RUST_SDK_TOOLCHAIN: 1.96.0
          SPINDLE_BIN: target/release/spindle
        run: contrib/rust-sdk/run.sh tmp/rust-sdk/results.log
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-sdk-suite
          path: tmp/rust-sdk/
          if-no-files-found: ignore
