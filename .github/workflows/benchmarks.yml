name: Benchmarks

# Published weekly from main (and on demand), so the numbers in the open are the
# numbers from the code on main rather than whatever was hand-copied into a
# document the last time somebody remembered. A figure typed into prose is a
# claim with nothing holding it to the code. Not on every push: a full
# `cargo bench` over the workspace cost about 15 job-minutes per merge, and the
# page is a trend line, not a gate.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Read-only by default. Only the deploy job can write Pages (#521): the
# measuring job runs `cargo bench` over every dependency's build script,
# and none of that needs a token that can publish the site.
permissions:
  contents: read

# One publish at a time, and never cancel one half-done: a partially deployed
# result set reads as "everything got fast".
concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2.9.3

      - name: Run the benchmark suite
        run: cargo bench --workspace --all-features

      - name: Collect the results
        run: |
          set -euo pipefail
          mkdir -p site
          python3 scripts/collect-benchmarks.py \
            target/criterion site/latest.json \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --runner "github-actions/ubuntu-24.04"

      - name: Render the page
        run: |
          python3 scripts/render-benchmarks.py site/latest.json site/index.html \
            --repository "${GITHUB_REPOSITORY}"

      # The coverage dashboard rides along on the same site: one run republishes
      # both, so neither can describe a different commit than the other.
      - name: Render the dashboard
        run: python3 scripts/coverage-dashboard.py --html site/dashboard.html

      # The per-milestone competitive numbers are measured off-CI (a shared
      # runner cannot host both sides honestly — docs/benchmarks.md) and
      # committed as raw JSON; publishing re-renders whatever is committed.
      - name: Render the milestone comparisons
        run: python3 scripts/render-comparisons.py docs/benchmarks/data site/comparisons.html

      # Keeping the per-commit file means a regression can be traced to the
      # push that caused it, rather than only observed after the fact.
      - name: Keep a per-commit copy
        run: cp site/latest.json "site/${GITHUB_SHA}.json"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  publish:
    # A dispatch on a candidate branch measures it without replacing the
    # public main results. Only main may deploy the benchmark site.
    if: github.ref == 'refs/heads/main'
    needs: measure
    runs-on: ubuntu-24.04
    # deploy-pages publishes the artifact and proves who it is with an
    # OIDC token; that is all this job does.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5.0.1
