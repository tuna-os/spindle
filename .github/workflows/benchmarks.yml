name: Benchmarks

# Published on every push to main, so the numbers in the open are the numbers
# from the code on main rather than whatever was hand-copied into a document
# the last time somebody remembered. A figure typed into prose is a claim with
# nothing holding it to the code.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one half-done: a partially deployed
# result set reads as "everything got fast".
concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the benchmark suite
        run: cargo bench --workspace --all-features

      - name: Collect the results
        run: |
          set -euo pipefail
          mkdir -p site
          python3 scripts/collect-benchmarks.py \
            target/criterion site/latest.json \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --runner "github-actions/ubuntu-24.04"

      - name: Render the page
        run: |
          python3 scripts/render-benchmarks.py site/latest.json site/index.html \
            --repository "${GITHUB_REPOSITORY}"

      # The coverage dashboard rides along on the same site: one push to main
      # republishes both, so neither can describe a different commit than the
      # other.
      - name: Render the dashboard
        run: python3 scripts/coverage-dashboard.py --html site/dashboard.html

      # The per-milestone competitive numbers are measured off-CI (a shared
      # runner cannot host both sides honestly — docs/benchmarks.md) and
      # committed as raw JSON; publishing re-renders whatever is committed.
      - name: Render the milestone comparisons
        run: python3 scripts/render-comparisons.py docs/benchmarks/data site/comparisons.html

      # Keeping the per-commit file means a regression can be traced to the
      # push that caused it, rather than only observed after the fact.
      - name: Keep a per-commit copy
        run: cp site/latest.json "site/${GITHUB_SHA}.json"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish:
    needs: measure
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
