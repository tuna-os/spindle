name: Performance

# Prose-only changes cannot move a budget, so they do not start this (no
# job here is a required check, so a run that never starts blocks nothing).
on:
  pull_request:
    paths-ignore: ['**.md', '**.mdx', 'docs/**', .ste-budget]
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.mdx', 'docs/**', .ste-budget]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-regression-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run release-mode performance budgets
        run: cargo test --release --test performance -- --ignored --nocapture

      # The same idea one layer up. The core budgets guard the library; these
      # guard the request paths, where every performance defect this project
      # has actually shipped lived (#172, #173, #175) and where nothing was
      # asserting the shape.
      - name: Run server read budgets
        run: cargo test --release -p spindle-server --test read_budget -- --ignored --nocapture
