name: Performance

# Runs on a pull request only when something that can move a budget changed
# (Rust sources, the vendored crate, the manifests, the toolchain pin, this
# file). Scripts, deploy files, evidence and prose cannot, so they do not
# start it. No job here is a required check, so a run that never starts
# blocks nothing. It no longer runs on every push to main: each merge was a
# PR whose head already ran it, so the post-merge run re-proved the same
# result; a nightly run on main takes its place and catches an interaction
# between two PRs the same day.
on:
  pull_request:
    paths:
      - 'crates/**'
      - 'vendor/**'
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/performance.yml
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-regression-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.90.0
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run release-mode performance budgets
        run: cargo test --release --test performance -- --ignored --nocapture

      # The same idea one layer up. The core budgets guard the library; these
      # guard the request paths, where every performance defect this project
      # has actually shipped lived (#172, #173, #175) and where nothing was
      # asserting the shape.
      - name: Run server read budgets
        run: cargo test --release -p spindle-server --test read_budget -- --ignored --nocapture
