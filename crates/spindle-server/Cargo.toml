[package]
name = "spindle-server"
version = "0.1.0"
description = "HTTP surface for the Spindle homeserver"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

# The crate is spindle-server because it is the server crate; the executable an
# operator runs is `spindle`. Without this the binary inherits the package name,
# which is what the Complement image asked for and did not find.
[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
argon2.workspace = true
axum.workspace = true
blake3.workspace = true
rand.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
spindle-core = { path = "../spindle-core" }
spindle-store = { path = "../spindle-store" }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
ruma.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
