[package]
name = "spindle-server"
version = "0.1.0"
description = "HTTP surface for the Spindle homeserver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the release is goreleaser binaries, and nothing in CI runs
# `cargo publish`. Saying so keeps an accidental publish from being one
# command away, and lets `cargo deny` tell an intra-workspace path
# dependency apart from an unpinned third-party one.
publish = false

# The crate is spindle-server because it is the server crate; the executable an
# operator runs is `spindle`. Without this the binary inherits the package name,
# which is what the Complement image asked for and did not find.
[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
argon2.workspace = true
bcrypt.workspace = true
unicode-normalization.workspace = true
axum.workspace = true
axum-server.workspace = true
form_urlencoded.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rustls.workspace = true
reqwest.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
hickory-resolver.workspace = true
lettre.workspace = true
blake3.workspace = true
ring.workspace = true
image.workspace = true
rand.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
regex.workspace = true
spindle-core = { path = "../spindle-core" }
spindle-store = { path = "../spindle-store" }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tower.workspace = true

rusqlite = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "trace"] }

# Distribution packages (#825). release.yml builds them from the release
# binary with cargo-deb and cargo-generate-rpm; nothing here changes a normal
# `cargo build`. `target/pkg/` is staged by the workflow: the unit is the
# one in deploy/systemd with ExecStart moved from /usr/local/bin (where the
# tarball puts the binary) to /usr/bin. The unit uses DynamicUser, so no
# maintainer script creates an account, and nothing enables the service:
# the operator edits the config first.
# scripts/build-packages.sh copies every asset into package-staging/ and runs
# both tools from this directory, so each path below is the same whether a
# tool reads it relative to the crate or to the working directory.
[package.metadata.deb]
name = "spindle"
section = "net"
priority = "optional"
maintainer = "TunaOS <https://github.com/tuna-os/spindle>"
extended-description = "Spindle is a Matrix homeserver in one binary over an embedded store."
depends = "$auto, ca-certificates"
conf-files = ["/etc/spindle/spindle.toml"]
assets = [
    ["package-staging/spindle", "usr/bin/spindle", "755"],
    ["package-staging/spindle.service", "usr/lib/systemd/system/spindle.service", "644"],
    ["package-staging/spindle.example.toml", "etc/spindle/spindle.toml", "600"],
    ["package-staging/LICENSE-MIT", "usr/share/doc/spindle/LICENSE-MIT", "644"],
    ["package-staging/LICENSE-APACHE", "usr/share/doc/spindle/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
name = "spindle"
summary = "Spindle Matrix homeserver"
assets = [
    { source = "package-staging/spindle", dest = "/usr/bin/spindle", mode = "755" },
    { source = "package-staging/spindle.service", dest = "/usr/lib/systemd/system/spindle.service", mode = "644" },
    { source = "package-staging/spindle.example.toml", dest = "/etc/spindle/spindle.toml", mode = "600", config = "noreplace" },
    { source = "package-staging/LICENSE-MIT", dest = "/usr/share/doc/spindle/LICENSE-MIT", mode = "644", doc = true },
    { source = "package-staging/LICENSE-APACHE", dest = "/usr/share/doc/spindle/LICENSE-APACHE", mode = "644", doc = true },
]

[features]
# Off by default: the reader is a one-shot migration path, and the hot CI
# gate and a development build should not pay a C compile for it. The
# release builds turn it on (FEATURES in .github/workflows/release.yml and
# the Dockerfile, #826): the importer must be the same build as the server
# whose store it opens.
synapse-import = ["dep:postgres", "dep:rusqlite"]
# `spindle import-mas` (#797): reads a MAS PostgreSQL database. Off by
# default, so the hot CI gate and a development build do not compile a
# PostgreSQL client for a one-shot migration. The release builds turn it
# on (FEATURES in .github/workflows/release.yml and the Dockerfile, #802):
# the importer must be the same build as the server whose store it opens.
mas-import = ["dep:postgres"]
# Enable the production-corpus replay harness.
corpus-replay = []
# MSC3995 linearized hub mode (#22, SPEC section 12). Off by default and off
# in production: a build without it serves no hub route, sends no hub EDU and
# reads none, so it carries no unstable wire behaviour at all. With it, the
# behaviour is still dormant until `[federation.hub] enabled = true`.
hub-mode = []

[dev-dependencies]
tokio-rustls = "0.26"
# The hub-mode tests partition two servers with a TCP proxy between them.
tokio = { workspace = true, features = ["io-util", "sync"] }
# `state-res` so the tests can judge our events with the same implementation a
# federating peer would (ADR 0002: ruma judges, it never builds our side).
ruma = { workspace = true, features = ["state-res", "events"] }
tempfile.workspace = true
rcgen.workspace = true
tower.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true
proptest.workspace = true
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "delayed_events"
harness = false

[[bench]]
name = "delayed_firing"
harness = false

[[bench]]
name = "ring_latency"
harness = false

[[bench]]
name = "call_churn"
harness = false

[[bench]]
name = "federated_timing"
harness = false
