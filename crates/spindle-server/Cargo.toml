[package]
name = "spindle-server"
version = "0.1.0"
description = "HTTP surface for the Spindle homeserver"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The crate is spindle-server because it is the server crate; the executable an
# operator runs is `spindle`. Without this the binary inherits the package name,
# which is what the Complement image asked for and did not find.
[[bin]]
name = "spindle"
path = "src/main.rs"

[dependencies]
argon2.workspace = true
axum.workspace = true
axum-server.workspace = true
form_urlencoded.workspace = true
rustls.workspace = true
reqwest.workspace = true
sha2.workspace = true
hmac.workspace = true
blake3.workspace = true
image.workspace = true
rand.workspace = true
ruma.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
spindle-core = { path = "../spindle-core" }
spindle-store = { path = "../spindle-store" }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

rusqlite = { workspace = true, optional = true }

[features]
# Off by default: the reader is a one-shot migration path, and neither the
# server binary nor the hot CI gate should pay a C compile for it.
synapse-import = ["dep:rusqlite"]

[dev-dependencies]
# `state-res` so the tests can judge our events with the same implementation a
# federating peer would (ADR 0002: ruma judges, it never builds our side).
ruma = { workspace = true, features = ["state-res", "events"] }
tempfile.workspace = true
tower.workspace = true
reqwest.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
