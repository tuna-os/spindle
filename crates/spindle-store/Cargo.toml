[package]
name = "spindle-store"
version = "0.1.0"
description = "Durable ordered-key storage for the Spindle linear log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the release is goreleaser binaries, and nothing in CI runs
# `cargo publish`. Saying so keeps an accidental publish from being one
# command away, and lets `cargo deny` tell an intra-workspace path
# dependency apart from an unpinned third-party one.
publish = false

[dependencies]
blake3.workspace = true
fjall.workspace = true
spindle-core = { path = "../spindle-core" }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
