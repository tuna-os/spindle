[package]
name = "spindle-core"
version = "0.1.0"
description = "Core linear-log and persistent-state primitives for Spindle"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
blake3.workspace = true
ruma.workspace = true
serde_json.workspace = true

[dev-dependencies]
blake3.workspace = true
criterion.workspace = true
im.workspace = true
proptest.workspace = true
# The oracle for SPEC 19.2. A dev-dependency deliberately: ADR 0002 keeps the
# core ruma-free precisely so that comparing our state handling against ruma's
# reference resolver is not circular.
ruma = { workspace = true, features = ["state-res", "events"] }
serde_json.workspace = true

[[bench]]
name = "fork_window"
harness = false

[[bench]]
name = "state_snapshot"
harness = false

[lints]
workspace = true
