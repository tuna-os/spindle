[package]
name = "spindle-core"
version = "0.1.0"
description = "Core linear-log and persistent-state primitives for Spindle"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Not published: the release is goreleaser binaries, and nothing in CI runs
# `cargo publish`. Saying so keeps an accidental publish from being one
# command away, and lets `cargo deny` tell an intra-workspace path
# dependency apart from an unpinned third-party one.
publish = false

[dependencies]
blake3.workspace = true
ruma.workspace = true
serde_json.workspace = true

[dev-dependencies]
blake3.workspace = true
criterion.workspace = true
imbl.workspace = true
proptest.workspace = true
# The oracle for SPEC 19.2. A dev-dependency deliberately: ADR 0002 keeps the
# core ruma-free precisely so that comparing our state handling against ruma's
# reference resolver is not circular.
ruma = { workspace = true, features = ["state-res", "events"] }
serde_json.workspace = true

[[bench]]
name = "fork_window"
harness = false

[[bench]]
name = "state_snapshot"
harness = false

[[bench]]
name = "state_res_comparison"
harness = false

[lints]
workspace = true
