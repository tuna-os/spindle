# Spindle homeserver configuration.
#
# Only `server.name` is required. Every other value below is its default, shown
# so you can see what you are changing rather than what you are adding. Values
# that have no default are commented out and shown with a plausible setting.
#
# Every configurable field appears here. `scripts/config-drift.py` fails CI if
# one is added to the code and not documented here, because a setting an
# operator cannot discover is a setting that does not exist.

[server]
# Permanent. It is baked into every user and room ID this server mints, and
# those federate — changing it later orphans every room the server is in.
name = "example.org"

# Loopback by default: binding every interface on install would be an exposure
# decision made on your behalf. Put a reverse proxy in front, or change this
# deliberately.
bind = "127.0.0.1:8008"

# What `.well-known` tells clients to connect to, when that differs from
# `name`. Delegation is the ordinary case — it exists so the server name need
# not be the hostname.
# public_base_url = "https://matrix.example.org"

[storage]
path = "./data"

# Media blobs in an S3-compatible bucket instead of on local disk. The
# metadata store stays local either way: it is the index, and an index a
# network hop away would put a round trip in front of every media request
# before a single byte moved.
#
# `endpoint` is explicit rather than derived from the region, because the
# point of speaking the S3 protocol is that MinIO, Garage and friends speak
# it too — and only AWS's endpoints are derivable.
# [storage.s3]
# endpoint = "https://s3.eu-west-1.amazonaws.com"
# bucket = "spindle-media"
# region = "us-east-1"
# access_key_id = "..."
# secret_access_key = "..."

[ratelimit]
# On by default, because a server exposed to the internet without it is a
# brute-force target (#66). Turn it off only where the limiter would be
# measuring the harness rather than the server: Complement registers users
# faster than any human, and the API benchmark's whole job is to issue
# requests as fast as the server will take them. Both would otherwise report
# our own rate limit as the server's latency.
enabled = true
# How many MatrixRTC rings (MSC4075 `m.rtc.notification`) one account may send
# per minute, across all its rooms. A ring makes every phone in the room sound
# at high priority, so it has a budget of its own (#39). Zero is refused at
# startup. Off with `enabled = false`.
rings_per_minute = 10

[previews]
# URL previews make the server fetch attacker-chosen URLs, which is the
# textbook server-side request forgery vector: "preview this" must never
# become a way to read the metadata service, the loopback admin port, or
# anything else inside the network this server sits in.
enabled = true

# Private, loopback, link-local and other non-global ranges are refused by
# *resolved address*, always. This opens named CIDR ranges back up — for
# tests, which serve fixtures on 127.0.0.1, and for the rare deployment that
# genuinely wants previews of an internal wiki and says so range by range.
allow_private = []

[push]
# Deliver notifications to the push gateways clients register (`POST
# /pushers/set`). Off keeps the registrations and sends nothing.
enabled = true

# A pusher is a URL a client handed this server, fetched every time one of
# that client's rooms has something to say -- the same request-forgery
# vector as a URL preview, held open for as long as the registration
# stands. A gateway that resolves inward (loopback, RFC 1918, link-local,
# the cloud metadata service) is refused by resolved address unless its
# range is listed here, and a literal address that would be refused is
# refused at registration. Same judgement as `[previews] allow_private`.
# Test rigs whose gateway is a loopback stub list "127.0.0.0/8".
allow_internal = []

[federation]
# Fetch peer keys and send requests over plain http instead of https. For
# test rigs whose "servers" are loopback stubs. A production deployment with
# this on has disabled federation authentication in all but name: anyone on
# the network path can answer the key fetch.
insecure_http = false

# CIDR ranges a federation fetch may reach although they are not routable.
# Every key fetch and outbound transaction connects to a host a stranger
# named -- an X-Matrix origin, a room's membership -- so a server name that
# resolves inward (loopback, RFC 1918, link-local, the cloud metadata
# service) is refused by resolved address, always, unless its range is
# listed here. Same judgement as `[previews] allow_private`. Test rigs whose
# peers are loopback stubs list "127.0.0.0/8"; a production deployment
# should not need an entry.
allow_internal = []

# Base retry delay for outbound delivery, in milliseconds. Doubles per
# consecutive failure per destination, capped at 64×. Tests shrink it;
# operators should not need to touch it.
retry_base_ms = 1000

# Where the federation TLS listener binds. Unset means no federation
# listener at all — which is right for a deployment behind a reverse proxy
# that terminates TLS and serves federation on the main bind.
# bind = "0.0.0.0:8448"

# PEM certificate chain and private key for that listener. Required with
# `bind`: federation peers speak https to 8448, and a listener that cannot
# prove its name is unreachable in practice.
# tls_cert = "/etc/spindle/fullchain.pem"
# tls_key = "/etc/spindle/privkey.pem"

[appservices]
# Paths to appservice registration files, in the spec's YAML shape. Every
# file must load and validate or the server refuses to start: a bridge
# silently not registered looks exactly like a bridge receiving nothing.
registrations = []

[auth]
# Serve a minimal OAuth 2.0 / OIDC provider from this same process, so
# MSC3861-native clients (Element X; Element Web's OIDC flow) can log in
# with no separate Matrix Authentication Service deployed. Tokens it
# mints are ordinary Spindle sessions. The issuer is
# `server.public_base_url` (falling back to `https://<server.name>`);
# mutually exclusive with `[auth.delegated]`. See docs/delegated-auth.md
# for both options.
# builtin_oidc = false

# MSC3861 delegation: an external OIDC provider (typically the Matrix
# Authentication Service) owns identity, and this server validates its
# access tokens by introspection. Local password login and registration
# turn off when this is set — one identity provider is the point, and two
# is how accounts drift apart.
#
# The provider is named explicitly rather than discovered at startup: a
# server that cannot boot because an idP was briefly unreachable is an
# outage nobody asked for.
# [auth.delegated]
# issuer = "https://mas.example.org/"
# introspection_endpoint = "https://mas.example.org/oauth2/introspect"
# client_id = "0000000000000000000SYNAPSE"
# client_secret = "..."
#
# The token the provider presents when calling *us* — MAS's `matrix.secret`,
# guarding the `/_synapse/mas/*` provisioning surface. Without it that
# surface answers 404 and the provider cannot manage accounts here.
# homeserver_secret = "..."

[turn]
# TURN relays, for calls that cannot connect peer-to-peer.
#
# Empty is a working configuration: `/voip/turnServer` answers with an empty
# object, which is what the spec says and what clients expect. Most calls
# never need a relay — the ones behind symmetric NAT do, and without one they
# fail silently, which is why this is usually configured after the first
# complaint rather than before it.
# uris = [
#     "turn:turn.example.org:3478?transport=udp",
#     "turn:turn.example.org:3478?transport=tcp",
# ]
#
# coturn's `static-auth-secret`. Credentials are minted per request as
# `expiry:@user:example.org` with an HMAC-SHA1 of that under this secret, so
# they expire on their own and the relay verifies them without an account
# database and without ever contacting this server. Prefer this.
# shared_secret = "the same string as coturn's static-auth-secret"
#
# The alternative, for a relay that speaks nothing else: one fixed pair
# handed to every client. It cannot expire and cannot be revoked for one
# caller. Mutually exclusive with shared_secret, and refused at startup if
# both are set.
# username = "spindle"
# password = "..."
#
# How long an issued credential lasts, and the `ttl` reported to clients as
# their cue to fetch a fresh one. Defaults to a day, which is coturn's own.
# ttl_seconds = 86400

[rtc]
# MatrixRTC transports (MSC4143) — where a call's media is carried.
#
# This server never touches the media and never speaks to the backend. Its
# whole part in a call is telling clients where the backend is, on two
# surfaces: here, authenticated, at /_matrix/client/v1/rtc/transports (and
# the org.matrix.msc4143 unstable path shipping clients actually ask for),
# and unauthenticated in /.well-known/matrix/client, which is how a client
# finds a backend before it has a token.
#
# Empty is a working configuration: the endpoint answers an empty list, and
# well-known omits the key. Clients read that as "this deployment has no
# call backend", which is true, rather than as a broken server.
#
# The order is yours and is passed through untouched — clients read the list
# as a priority ordering, and this server does not know which of your
# backends is nearest.
#
# The URL is the LiveKit *JWT service* (element-hq/lk-jwt-service), not the
# SFU itself: clients ask it for a token and it tells them where the SFU is.
# Both are URLs and only one works, which is the mistake worth naming.
# foci = [
#     { type = "livekit", livekit_service_url = "https://livekit.example.org/jwt" },
# ]

# The built-in LiveKit JWT service (#38, MSC4195) — off unless the
# `[rtc.livekit]` section below is set, with all three of url, key and
# secret. The header is commented out with the rest for that reason: a
# section that is present but empty is a misconfiguration, not "off".
# See docs/matrix-rtc.md for the deployment end to end.
# [rtc.livekit]
#
# With it set, this server mints the tokens clients present to the SFU
# itself, and a deployment needs no lk-jwt-service. It advertises itself
# as a `livekit` transport ahead of `foci` above, at
# <public_base_url>/_spindle/rtc/livekit, which is what a client posts to.
#
# What it does that the external service cannot: a token is minted only
# for a room the user is joined to *at that moment*, checked against this
# server's own membership index. What it cannot do: revoke. A minted token
# is stateless and the SFU never asks again, so a user who leaves the room
# holds their token until it expires — which is why the window below is
# short, and why it is the whole of the guarantee.
#
# The SFU's own websocket address, as handed to clients with their token.
# url = "wss://livekit.example.org"
#
# LiveKit's API key and secret — the same pair the SFU was started with
# (`--keys`, or `keys:` in its config). The secret signs every token and is
# shared with the SFU and nothing else: it is not this server's signing
# key, and it is never logged.
# key = "APIxxxxxxxx"
# secret = "..."
#
# How long a minted token admits its holder, in seconds. Fifteen minutes by
# default: enough to join and ride out a reconnect, short enough that a
# token outliving its membership is not an afternoon's access. Must be > 0.
# lk-jwt-service issues an hour; set 3600 here to match it if a client
# needs that, knowing what it buys.
# token_ttl_seconds = 900

[metrics]
# Prometheus scrape surface, off unless this is set. Its own listener, on
# loopback: the exposition names the peers this server federates with and
# the volume it carries, so it is an operator's surface rather than a
# public one. See docs/metrics.md.
# bind = "127.0.0.1:9090"

[delayed_events]
# MSC4140 delayed events: an event handed over now and sent later, which
# Matrix RTC uses as a dead-man's switch so a call membership expires when
# a participant's client vanishes instead of leaving a ghost behind.
#
# Both caps exist because a pending delay is storage this server holds on a
# client's say-so. Uncapped, a client can schedule delays as fast as it can
# send requests and never refresh them.
#
# The longest delay this server will accept, in milliseconds. The default is
# a day -- far past any call heartbeat, and still bounded. Must be > 0: a
# zero would refuse every delayed event rather than mean "unlimited", so the
# server refuses to start on one instead of silently disabling the feature.
# max_delay_ms = 86400000
#
# The most pending delays one sender may hold in one room. Per sender *and*
# per room, because that is the unit a client works in -- a legitimate
# Matrix RTC client sits at one. Must be > 0, for the same reason.
# max_per_room = 100

[limits]
# Ceilings on what one account may make this server hold. Each of these
# stores grew without bound under an ordinary registered account before the
# caps existed: nothing ever deleted a filter, every new account-data type
# added a row, and one-time keys were accepted for as long as a client kept
# sending them. A write past a cap is refused with 400 `M_LIMIT_EXCEEDED`,
# the same answer the delayed-events caps give. Every cap must be > 0: a
# zero would refuse every write, and a config that quietly disables a
# feature is worse than one that will not load.
#
# Filters a user may hold. `POST /filter` appends; nothing deletes.
# filters_per_user = 1000
#
# Account-data types one user may hold, global and per-room together.
# Rewriting a type that already exists does not count against this.
# account_data_per_user = 20000
#
# One-time keys one device may hold unclaimed. A client past the cap has
# stopped claiming, not run short.
# one_time_keys_per_device = 1000
#
# Pushers one account may register. A client registers one per device.
# pushers_per_user = 100

[logging]
# A `tracing-subscriber` filter directive.
# filter = "spindle=debug,warn"
