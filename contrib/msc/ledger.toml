# Every MSC Spindle serves, partly serves, has planned, or has declined --
# the one place that says so, and the one `scripts/msc-ledger.py` reads.
#
# The check (`--check`, run in CI) holds this file to the code: every
# `org.matrix.mscNNNN` flag `/versions` advertises and every route served
# under an `unstable/org.matrix.mscNNNN` prefix must have an entry here
# that is `served` or `partial`, every entry that claims either must name a
# test that mentions the MSC, and the rendered page docs/mscs.md must match.
# The upstream pass (`--upstream`, run weekly by upkeep.yml) asks GitHub
# what became of each proposal, so a merge that hands a stable spelling to
# something served here under its unstable name is noticed, and a proposal
# closed unmerged is not carried forward as "planned".
#
# status:  served    -- the MSC's behaviour is built and a test proves it
#          partial   -- some of it; `notes` says which part
#          planned   -- on the roadmap, nothing built
#          design    -- shapes the architecture; nothing to serve or test
#          superseded -- absorbed by another MSC named in `notes`
#          declined  -- looked at and not taken; `notes` says why
# stable:  the spec version the MSC landed in, or "" while it has not.
# merged:  true when the proposal has merged upstream but no spec release
#          names it yet, so there is no stable version to record and no
#          stable spelling to adopt; the weekly report stops asking.
# unstable: the `/versions` unstable_features flags advertised for it.
# evidence: files that prove the status; a served or partial entry needs
#          at least one test file that mentions the MSC number.

