# Every route the router serves, and the rate limit its handler spends --
# or `none`, and why. `scripts/limits-ledger.py --check` holds this file to
# the code: a route with no row fails, a row for a route that is gone
# fails, and so does a row that names a limit its handler does not reach.
#
# The point is the `none` rows. A route that is in no limiter used to be
# the absence of a call, which nobody reviews. Here it is a line with a
# reason, and a new route cannot arrive without one (#953).
#
# A row is `"METHOD path" = { spends = [...] }` or `{ none = "reason" }`.
#
# spends: each limit the handler can spend, as the source writes it: a
#         `Limit` constant of ratelimit.rs, a `Budget::` variant, or the
#         `[ratelimit]` count that a handler makes a limit of. The check
#         finds the name in the handler or in a function it calls.
# none:   the name of an entry in `[reasons]`. The reason says who can
#         call the route or what it does. It does not say that no limit is
#         right; docs/rate-limits.md is where a decision is argued.
#
# A reason's `sees` is its proof: the handler must reach one of the names
# in the list, so a row cannot claim a caller its handler never asks for.
# A reason with no `sees` is a statement that a reviewer checks.
#
# What the check cannot see: whether a limit is the right size, and
# whether a handler that reaches a limit spends it on every path.

[reasons.admin]
text = "Only a server admin can call it."
sees = ["AdminActor"]

[reasons.peer]
text = "Only another server can call it, and the request must have that server's signature."
sees = ["federation_origin"]

[reasons.provider]
text = "Only the delegated-auth provider can call it, with the secret of the deployment."
sees = ["admit"]

[reasons.service]
text = "Only an application service can call it, with its token."

[reasons.signed]
text = "The request must have a signature that only a holder of a deployment secret can make."

[reasons.account-read]
text = "A signed-in account reads. docs/rate-limits.md records that reads have no limit."
sees = ["Authenticated", "AccountAuthenticated"]

[reasons.account-write]
text = "A signed-in account writes, and the write has no budget."
sees = ["Authenticated"]

[reasons.session]
text = "Only a browser that signed in on the account pages can call it."
sees = ["browser_session"]

[reasons.capability]
text = "It needs no account. It acts only when the request has a token or a password that proves the caller."

[reasons.fixed]
text = "It needs no account, and the answer does not depend on the caller."

[reasons.open]
text = "It needs no account."

[reasons.cached-only]
text = "It needs no account. It serves only media that this server holds; the fetch that spends Budget::RemoteMedia is in its shared helper and is never taken here."

